name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint:registry
      - run: corepack pnpm lint:core
      - run: corepack pnpm lint:rpc
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm test:evals
      # The kernel's coverage thresholds (03 §7.1) are enforced here: the audit
      # found the >=85% target was unverifiable because no tooling existed.
      - run: corepack pnpm --filter @syaocode/rpc run test:coverage
      # The audit (05 §10.1 C-5) found `lint:rpc` and `build` were not gated,
      # and that a green build did not prove the artifact runs. Both are now
      # required, and build:check starts the built CLI the way a user would.
      - run: corepack pnpm build
      - run: corepack pnpm build:check
